[package]
name = "cnvlens-core"
version = "0.2.0"
edition = "2021"
description = "Rust/WASM BGZF/BAM parser + CNV/SNV pipeline for CNVLens"
license = "MIT"
repository = "https://github.com/Pogo-Bash/cnvlens"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"
noodles = { version = "0.111", features = ["bam", "bgzf", "sam", "csi", "core"] }

# wasm-only glue: not pulled in for native (host) builds / the bench binary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
